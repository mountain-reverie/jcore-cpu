# SH-4 MMU control registers (J4 overlay, PRIV_ARCH). All privileged.
# These are additive overlay entries: absent from the base J2 decoder, so
# they raise General Illegal on J2. See spec §5.
#
# ---- ENCODING POLICY (the retired `0000 nnnn xxxx 1011` MMU read family) ----
# J4 is targeted to be a superset of J2, SH-2A, SH-4 and SH-4A, so a J4-only
# instruction may not occupy an encoding any of those four defines. This file
# once carried a register read side in `0000 nnnn xxxx 1011`:
#
#   STC TSBPTR,Rn    0x?4B      STC PTEH,Rn      0x?8B
#   STC PTEL,Rn      0x?9B      STC ASIDR,Rn     0x?BB
#   CMP/EQ PTEH,Rn   0x?CB      CMP/EQ ASIDR,Rn  0x?DB
#   LDTLB.RN Rm      0x?FB
#
# All seven were retired once the hardware TSB walker made the software
# TLB-miss hot path they existed to shorten obsolete; the CSRs are now read
# through their P4 MMIO aliases instead, so the whole `xxxx 1011` family is
# free again and is the natural first reserve for future J4-only
# `0000 nnnn`-shaped instructions. Check any candidate family with:
#
#   go run ./cmd/cpugen freespace --avoid j2,sh2a,sh4,sh4a,dsp \
#       --overlay sh4 --form "----nnnn----1011" --region 0
#
# The WRITE side below is deliberately kept: LDC Rm,{PTEH,PTEL,ASIDR} still
# feeds LDTLB, and a register write has no P4-alias equivalent that would let
# the TLB be loaded atomically enough for the install sequence.
#
# ---- DELIBERATE FORECLOSURE: SH-DSP ----
# The LDC write side (`0100 mmmm xxxx 1110`, xxxx = 0101 PTEH / 0110 PTEL /
# 0111 ASIDR) overlays SH-DSP's `ldc Rm,MOD/RS/RE`, and STC EXPEVT/INTEVT/TRA
# in exceptions.toml likewise overlay `stc MOD/RS/RE,Rn`. This is NOT an
# oversight and cannot be avoided: after excluding j2/sh2a/sh4/sh4a the LDC
# family has exactly three surviving slots, and they are precisely the DSP
# ones. J4 therefore forecloses SH-DSP permanently. Recorded here because the
# freespace tool will report the overlap whenever `dsp` is left out of --avoid.

[[instr]]
  name = "LDC Rm, PTEH"
  privileged = true
  format = "m"
  opcode = "0100 mmmm 0101 1110"
  operation = "Rm -> PTEH (MMU page-table-entry high)"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "Rm"
    zbus = "PTEH"
    zbus_sel = "Y"

[[instr]]
  name = "LDC Rm, PTEL"
  privileged = true
  format = "m"
  opcode = "0100 mmmm 0110 1110"
  operation = "Rm -> PTEL (MMU page-table-entry low)"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "Rm"
    zbus = "PTEL"
    zbus_sel = "Y"

[[instr]]
  name = "LDC Rm, ASIDR"
  privileged = true
  format = "m"
  opcode = "0100 mmmm 0111 1110"
  operation = "Rm -> ASIDR (address space identifier)"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "Rm"
    zbus = "ASIDR"
    zbus_sel = "Y"

[[instr]]
  name = "LDTLB"
  privileged = true
  opcode = "0000 0000 0011 1000"
  operation = "PTEH/PTEL/ASIDR -> TLB"
  [[instr.slots]]
    tlb_wr = "YES"
    mask_int = "YES"
    pc = "INC"

[[instr]]
  name = "LDTLB.RN"
  privileged = true
  format = "0"
  opcode = "0000 0000 0111 1000"
  operation = "PTEH/PTEL/ASIDR -> TLB; SR<-SSR, PC<-SPC (no delay slot)"

  [[instr.slots]]
    tlb_wr = "YES"
    ybus = "SSR"
    zbus_sel = "Y"
    sr = "Z"
    pc = "HOLD"
  [[instr.slots]]
    ybus = "SPC"
    zbus = "PC"
    zbus_sel = "Y"
    pc = "HOLD"
  [[instr.slots]]
    if_addy = "ZBUS"
    if_issue = "YES"
    pc = "HOLD"
  [[instr.slots]]
    dispatch = "YES"
    if_issue = "YES"
    pc = "INC"

# ---- Break / Reset CPU: bit-11 pin (J4 overlay only) ----
# The base spec uses don't-care bit 11 (---- -010 / ---- -011). That is correct
# for J1/J2/J4 without MMU, because no TLB exception opcodes exist to alias with.
# With PRIV_ARCH, nibbles 0xA (TLB DMISS_W) and 0xB (TLB IPROT) occupy bit 11 = 1
# in the system plane. A don't-care bit 11 in Break ("-010") aliases nibble 0xA,
# causing a D-store TLB miss to assert `debug` and stall the CPU. Similarly
# "-011" aliases nibble 0xB (IPROT). Pinning bit 11 = 0 here, in the overlay only,
# avoids perturbing the base decoder logic minimizer (which would regress J2 ASIC
# Fmax by ~14% if pinned in the base spec). Same aliasing class fixed for
# Interrupt/Error/Slot Illegal/General Illegal in spec/sh4/exceptions.toml.

[[instr]]
  name = "Break"
  format = ""
  opcode = "---- 0010 dddd dddd"
  operation = ""
  plane = "system"

  [[instr.slots]]
    pc = "HOLD"

  [[instr.slots]]
    alu_y = "2"
    arith = "SUB"
    debug = "YES"
    pc = "HOLD"
    xbus = "PC"
    zbus = "PC"
    zbus_sel = "ARITH"

  [[instr.slots]]
    if_addy = "ZBUS"
    if_issue = "YES"
    pc = "HOLD"

  [[instr.slots]]
    dispatch = "YES"
    if_issue = "YES"
    pc = "INC"

[[instr]]
  name = "Reset CPU"
  format = "d8"
  opcode = "---- 0011 dddd dddd"
  operation = ""
  plane = "system"

  [[instr.slots]]
    pc = "HOLD"

  [[instr.slots]]
    event = "ack"
    pc = "HOLD"

  [[instr.slots]]
    ma_addy = "ZBUS"
    ma_op = "READ"
    ma_size = "32"
    pc = "HOLD"
    ybus = "U*4"
    zbus = "TEMP0"
    zbus_sel = "Y"

  [[instr.slots]]
    alu_y = "4"
    arith = "ADD"
    ma_addy = "ZBUS"
    ma_op = "READ"
    ma_size = "32"
    pc = "HOLD"
    wbus = "R15"
    xbus = "TEMP0"
    zbus_sel = "ARITH"

  [[instr.slots]]
    pc = "HOLD"
    zbus = "PC"
    zbus_sel = "W"

  [[instr.slots]]
    if_addy = "ZBUS"
    if_issue = "YES"
    logic = "XOR"
    pc = "HOLD"
    xbus = "TEMP1"
    ybus = "TEMP1"
    zbus = "VBR"
    zbus_sel = "LOGIC"

  [[instr.slots]]
    dispatch = "YES"
    if_issue = "YES"
    pc = "INC"

  [[instr.slots]]
