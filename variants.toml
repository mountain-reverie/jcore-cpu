# Authoritative CPU variant table. Read by cpugen (Make consumers, via
# `cpugen variants -format=make`) and by jcore-soc's
# tools/socgen/elaborate/cpumap.go. This is the ONLY place that defines what
# distinguishes one CPU variant from another.
#
# generics    : cpu-level VHDL generics the variant binds true
# overlay     : cpugen decoder overlay under decode/gen-go/spec/ ("" = base)
# extra_files : cpu-submodule-relative sources only this variant needs
# config_file : the variant's VHDL configuration file (see core/cpu_config_*.vhd)
#
# NOTE: core/register_file_two_bank.vhd is deliberately NOT variant-specific.
# Every configuration except cpu_j1 binds register_file(two_bank), including
# cpu_j2, so it belongs in the shared base list.

[j1]
overlay     = ""
extra_files = []
config_file = "core/cpu_config_j1.vhd"

[j2]
overlay     = ""
extra_files = []
config_file = "core/cpu_config_j2.vhd"

[j2a]
generics    = { SH2A_ARCH = "true" }
overlay     = "sh2a"
extra_files = []
config_file = "core/cpu_config_j2.vhd"

# J4 = the multi-tenant family: privileged architecture + MMU, and later the
# hypervisor. PRIV_ARCH implies MMU; there is deliberately no separate knob.
# core/cpu.vhd instantiates work.tlb inside `g_mmu : if PRIV_ARCH generate`,
# but GHDL's `ghdl -i` + `ghdl -c`/`-m` flow resolves bindings from its own
# library graph, not file-list order -- confirmed: sim/tlb_tb passes under
# CPU_VARIANT=j4 with core/tlb.vhd listed AFTER core/cpu.vhd in the file
# list. So core/tlb.vhd does NOT need to precede core/cpu.vhd in this list;
# it only needs to be analyzed into the library at all (which is what this
# extra_files entry ensures for j4).
[j4]
generics    = { PRIV_ARCH = "true" }
overlay     = "sh4"
extra_files = ["core/tlb.vhd"]
config_file = "core/cpu_config_j4.vhd"
