name: pr-quick

# Fast PR feedback loop. Runs Steps 1-5 of decode/gen-go/regression.sh, plus a
# J1 sequential-multiplier in-pipeline check:
#   1. Go unit tests
#   2. make -C decode generate
#   3. cpu_ctb 180us with direct decoder
#   4. cpu_ctb 180us with ROM decoder
#   4b. J4 (sh4 overlay, PRIV_ARCH=1) decoder elaboration gate
#   5. make -C tests check (228 TAP unit tests)
#   6. cpu_ctb with mult(seq) -- the ONLY functional guard for the J1
#      sequential multiplier (cpu_j1 is never otherwise simulated).
#
# Step 4b elaborates the J4-overlay decoder (all three architectures:
# simple/direct/rom). `make -C decode generate-j4` succeeding does NOT mean
# the generated VHDL elaborates — the IMM_P256 constant-immediate blocker
# generated cleanly but failed to elaborate, and nothing built the overlay
# decoder, so the break was invisible until a local J4 build. This step
# closes that gap.
#
# Steps 7 (yosys synthesis) and 8 (openSTA) are deliberately deferred to
# full-regression.yml: their toolchains are too expensive on every push.
#
# Target wall-clock budget: under 10 minutes per run.

on:
  push:
    branches-ignore:
      # Avoid duplicate runs: master / main are covered by full-regression.yml.
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# Newer pushes to the same branch cancel in-flight runs.
concurrency:
  group: pr-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-quick:
    name: Go + simulator + TAP (Steps 1-5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Run in the same prebuilt CI image full-regression uses. It ships a
    # source-built GHDL 6.0.0 (mcode backend, VITAL-capable -> elaborates the
    # jcore-soc tech-RAM cache testbenches in Step 7), Go, and the GCC/make
    # toolchain at /usr/local/bin. This replaces the external
    # ghdl/setup-ghdl@v1 action, whose inventory.json format change broke the
    # '5.0.1' download; the container pins the exact toolchain instead.
    container:
      image: ghcr.io/${{ github.repository_owner }}/jcore-cpu-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Inside a container GitHub Actions defaults run: steps to sh (dash), which
    # rejects the `set -o pipefail` several steps (Steps 1-5, Step 4b, ...) use.
    # Force bash (present in the image) job-wide. The one step that must not run
    # under pipefail (the version probe, whose `| head` SIGPIPEs) disables it
    # locally with `set +o pipefail`.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout jcore-cpu
        uses: actions/checkout@v4
        with:
          path: jcore-cpu

      - name: Checkout jcore-soc (TOOLS_DIR)
        uses: actions/checkout@v4
        with:
          repository: j-core/jcore-soc
          path: jcore-soc

      # Sparse/shallow checkout: the assemble-only gate below only needs the
      # kernel headers under arch/sh/include (mmulinux.S / mmuhuge.S / etc.
      # pull in linux@jcore's SH uapi/asm headers via -I); it does NOT need a
      # kbuild build, so this is far cheaper than full-regression's full
      # checkout + kbuild step. Same repo/ref as full-regression.yml's
      # "Checkout linux@jcore" step -- keep them in sync.
      - name: Checkout linux@jcore (headers only, for the assemble-only gate)
        uses: actions/checkout@v4
        with:
          repository: mountain-reverie/linux
          ref: jcore
          path: linux
          sparse-checkout: |
            arch/sh/include
          sparse-checkout-cone-mode: false

      # WHY THIS STEP EXISTS: commit d14d723 left a literal `mov.l @r3, r3None`
      # in sim/tests/mmulinux.S and mmuhuge.S -- a Python str(None) leaked by an
      # ad-hoc migration script. gas rejected it, so both guards became
      # UNASSEMBLABLE and silently dropped out of CI for an entire phase of
      # work, hiding three further real defects behind the missing results.
      # Those four guards (mmulinux, mmuhuge, mmuboot, mmulinuxexc) only run in
      # full-regression.yml / sim/linux_sim.sh, which pr-quick intentionally
      # skips (they need kbuild objects) -- so without a dedicated check,
      # pr-quick has NO signal at all that a guard source stopped assembling.
      # This step is a cheap syntax-only substitute: it assembles every
      # sim/tests/*.S to a .o (no link, no kbuild objects needed -- see
      # sim/tests/Makefile's %.o rules) and greps for the exact typo shape a
      # bulk str()-based migration produces. It costs seconds and runs before
      # every other (expensive) step so a broken guard source fails fast.
      # If you are tempted to delete this step because it looks redundant with
      # Steps 1-7 below: it is not -- none of those steps touch sim/tests/*.S
      # syntax at all.
      - name: Guard lists agree on stop times
        working-directory: jcore-cpu
        # sim/mmu_sim.sh and full-regression.yml keep SEPARATE hand-maintained
        # guard lists. They have diverged repeatedly; most recently every m8_*
        # guard was budgeted 200-600us in CI against 300-900us locally, so a
        # change that made them slower passed locally and failed only in CI --
        # reported as a functional failure, because a stop-time overrun looks
        # exactly like one. Seconds to check, hours to debug when it lands.
        run: scripts/guard_list_drift.sh

      - name: Assemble-only syntax gate for sim/tests/*.S
        working-directory: jcore-cpu
        env:
          LINUX_SRC: ${{ github.workspace }}/linux
          J4GAS: /usr/local/bin/sh2-elf-as
        run: |
          set -euo pipefail

          # Catch the d14d723 typo class directly: a register operand
          # immediately followed by trailing letters (e.g. `r3None`) is the
          # fingerprint of a str(None)/similar bulk-substitution migration
          # script gone wrong. This is near-free and independent of whether
          # gas happens to reject the specific garbage token.
          echo "==> grep for r<N><word> typo class (d14d723 fingerprint)"
          if grep -nE '\br[0-9]+[A-Za-z][A-Za-z0-9_]*' sim/tests/*.S; then
            echo "::error::Found a register name immediately followed by trailing letters (e.g. 'r3None') in sim/tests/*.S." >&2
            echo "This is the exact shape commit d14d723 introduced: a Python str(None) (or similar)" >&2
            echo "leaked by a bulk migration/sed script into a register operand, e.g. 'mov.l @r3, r3None'." >&2
            echo "It silently made mmulinux.S/mmuhuge.S UNASSEMBLABLE and vanished from CI for a whole phase" >&2
            echo "of work. Fix the offending operand(s) above." >&2
            exit 1
          fi
          echo "    clean."

          # Assemble every guard source to a .o (syntax-only; no linking, no
          # kbuild objects). sim/tests/Makefile's %.o rules need only J4GAS
          # and, for the four linux-handler harnesses (mmulinux/mmulinuxexc/
          # mmuhuge/mmuboot), -I$(LINUX_SRC)/arch/sh/include -- both provided
          # above, matching full-regression.yml's J4GAS.
          echo "==> assemble-only pass over sim/tests/*.S"
          fail=0
          for f in sim/tests/*.S; do
            name="$(basename "$f" .S)"
            rm -f "sim/tests/$name.o"
            log="$(mktemp)"
            if ! make -C sim/tests CPU_VARIANT=j4 LINUX_SRC="$LINUX_SRC" J4GAS="$J4GAS" "$name.o" >"$log" 2>&1; then
              echo "FAIL: sim/tests/$f does not assemble" >&2
              cat "$log" >&2
              fail=1
            fi
            rm -f "$log" "sim/tests/$name.o"
          done
          if [ "$fail" != 0 ]; then
            echo "::error::One or more sim/tests/*.S guard sources failed to assemble -- see FAIL lines above." >&2
            exit 1
          fi
          echo "==> all sim/tests/*.S guard sources assemble cleanly"

      - name: Show toolchain versions
        run: |
          # No pipefail here: `<tool> --version | head` SIGPIPEs (exit 141) once
          # a tool prints more lines than head consumes (GHDL 6.0.0 does).
          set +o pipefail
          go version
          ghdl --version | head -3
          gcc --version | head -1
          make --version | head -1

      - name: Run regression Steps 1-5
        working-directory: jcore-cpu
        env:
          TOOLS_DIR: ${{ github.workspace }}/jcore-soc/tools
        run: |
          set -euo pipefail
          # Step 1: Go unit tests
          echo "==> Step 1: go test ./..."
          go -C decode/gen-go test ./...

          # Step 2: regenerate VHDL + verify the COMMITTED base decoder matches
          # a clean regeneration. `make -C decode clean` first so this is robust
          # to git-checkout mtimes (an incremental `make generate` no-ops when the
          # committed .vhd are newer than the spec, which would let stale or
          # WRONG-VARIANT tables pass). The j2 base decoder must stay the j2 base
          # decoder: if someone commits `make generate-j4` (sh4/PRIV_ARCH+MMU
          # overlay) output as the base tables, git diff catches it here instead
          # of silently bloating the ASIC/j2 decoder critical path (Fmax regression).
          echo "==> Step 2: make -C decode generate + committed-decoder check"
          make -C decode clean
          make -C decode generate
          if ! git diff --quiet -- decode/decode_pkg.vhd decode/decode.vhd \
                 decode/decode_body.vhd decode/decode_table_simple.vhd \
                 decode/decode_table_direct.vhd decode/decode_table_rom.vhd \
                 decode/sh2instr.c; then
            echo "FAIL: committed base decode tables differ from a clean 'make -C decode generate'." >&2
            echo "      The committed decoder is stale or was generated with the wrong variant" >&2
            echo "      (e.g. 'make generate-j4' overlay output committed as base)." >&2
            echo "      Fix: make -C decode clean && make -C decode generate, then commit decode/." >&2
            git --no-pager diff --stat -- decode/ >&2
            exit 1
          fi
          echo "    committed base decoder matches clean generation."

          # Step 3: build + run cpu_ctb with direct decoder
          echo "==> Step 3: cpu_ctb 180us [direct decoder]"
          cd sim
          rm -f work-obj93.cf cpu_ctb cpu_tb.vhh
          make TOOLS_DIR="$TOOLS_DIR" cpu_ctb work-obj93.cf >/dev/null
          LED_LOG="$(mktemp)"
          timeout 90 ./cpu_ctb --stop-time=180us 2>&1 | grep "^LED:" > "$LED_LOG" || true
          wc -l "$LED_LOG"
          # Verify expected 20 LED writes.
          actual=$(wc -l < "$LED_LOG")
          if [ "$actual" -ne 20 ]; then
            echo "FAIL [direct]: expected 20 LED writes, got $actual" >&2
            cat "$LED_LOG" >&2
            exit 1
          fi
          rm -f "$LED_LOG"
          cd ..

          # Step 4: rebuild with ROM decoder (CONFIG_DECODE_ROM=1 selects
          # cpu_sim_rom, see core/cpu_config_sim.vhd) and re-run.
          echo "==> Step 4: cpu_ctb 180us [ROM decoder]"
          cd sim
          rm -f work-obj93.cf cpu_ctb cpu_tb.vhh
          if ! make TOOLS_DIR="$TOOLS_DIR" CONFIG_DECODE_ROM=1 cpu_ctb work-obj93.cf >/dev/null 2>&1; then
            echo "    NOTE: ROM decoder elaboration failed (pre-existing project state)."
            echo "          Skipping ROM run; this mirrors regression.sh behavior."
          else
            LED_LOG_ROM="$(mktemp)"
            timeout 90 ./cpu_ctb --stop-time=180us 2>&1 | grep "^LED:" > "$LED_LOG_ROM" || true
            actual=$(wc -l < "$LED_LOG_ROM")
            if [ "$actual" -ne 20 ]; then
              echo "FAIL [rom]: expected 20 LED writes, got $actual" >&2
              cat "$LED_LOG_ROM" >&2
              exit 1
            fi
            rm -f "$LED_LOG_ROM"
          fi
          cd ..
          # Rebuild direct (default CONFIG_DECODE_ROM=0) for Step 5.
          cd sim
          rm -f work-obj93.cf cpu_ctb cpu_tb.vhh
          make TOOLS_DIR="$TOOLS_DIR" cpu_ctb work-obj93.cf >/dev/null
          cd ..

          # Step 5: TAP unit testbenches
          echo "==> Step 5: make -C tests check"
          make -C tests check TOOLS_DIR="$TOOLS_DIR"

          # Step 6: J1 sequential-multiplier in-pipeline functional check.
          # The broken mult(seq) silently DROPPED back-to-back MAC.L (which issue
          # their command from the writeback stage, draining past any front
          # stall) and hung at LED 0x33 -- BEFORE the multiply tests. The
          # slot-stretch fix serialises them, so the multiply tests (0x41..0x47)
          # now pass in-pipeline. cpu_j1 is never otherwise simulated (the
          # testrom above runs on the comb J2 multiplier), so this is the only
          # functional guard against this class of J1 regression.
          echo "==> Step 6: cpu_ctb [mult(seq), J1 sequential multiplier]"
          # CONFIG_MULT_SEQ=1 selects cpu_sim_mult_seq (u_mult bound to
          # mult(seq), leaving the fast comb shifter / two_bank regfile
          # untouched, so the multiplier is the only slow unit); see
          # core/cpu_config_sim.vhd. mult_seq.vhd is unconditionally in the
          # sim VHDS list (sim/Makefile), so no separate ghdl -i import step
          # is needed here.
          cd sim
          rm -f work-obj93.cf cpu_ctb cpu_tb.vhh
          make TOOLS_DIR="$TOOLS_DIR" CONFIG_MULT_SEQ=1 cpu_ctb work-obj93.cf >/dev/null
          LED_LOG_J1="$(mktemp)"
          # mult(seq) is ~32 cycles/multiply (the multiply tests run slower), so
          # allow extra sim time; the whole testrom still finishes in seconds.
          # Line-buffer so the trace survives the timeout.
          timeout 720 stdbuf -oL ./cpu_ctb --stop-time=220us 2>&1 \
            | stdbuf -oL grep "^LED:" > "$LED_LOG_J1" || true
          echo "    mult(seq) LED trace:"; sed 's/^/      /' "$LED_LOG_J1"
          # Proof: the FULL testrom passes (20 LED writes, ending 0x62) -- exactly
          # the same trace as the direct/ROM runs above on the J2 multiplier. This
          # includes the multiply tests (0x41..0x47); the broken mult(seq) dropped
          # back-to-back MAC.L and hung at 0x33 (only 9 LED writes).
          actual=$(wc -l < "$LED_LOG_J1")
          if [ "$actual" -ne 20 ]; then
            echo "FAIL [mult(seq)]: expected 20 LED writes (full testrom), got $actual" >&2
            echo "      J1 sequential multiplier regressed (broken version hangs at 0x33 = 9 writes)" >&2
            exit 1
          fi
          if ! grep -qi "WRITE 0x47 " "$LED_LOG_J1"; then
            echo "FAIL [mult(seq)]: multiply tests (..0x47) not reached -- J1 regressed" >&2
            exit 1
          fi
          echo "    mult(seq): full testrom passed (20 writes, multiply tests 0x41..0x47 incl.)"
          rm -f "$LED_LOG_J1"
          cd ..
          # Rebuild default (CONFIG_MULT_SEQ=0) for Step 7.
          cd sim
          rm -f work-obj93.cf cpu_ctb cpu_tb.vhh
          make TOOLS_DIR="$TOOLS_DIR" cpu_ctb work-obj93.cf >/dev/null
          cd ..

          # Step 7: dual-core cache-coherency guard (the repo's only SMP
          # functional test). cpu_dualcore_tb = two J2 cores with snoop-cross-
          # wired write-back D-caches sharing one memory. cpu1 stores a sentinel;
          # cpu0 polls its cached copy and must observe the write via coherency
          # (LED 0x5A). Also carries the T-bit delay-slot hazard shape (buggy
          # image): that hazard is hardware-only and does NOT reproduce in
          # functional sim, so 0x5A on both loops is healthy. run_repro.sh exits
          # 0 on health, 1 if coherency breaks, 2 on an (unexpected) sim repro --
          # a non-zero exit fails this step. Uses committed *.img fixtures (no
          # SH-2 cross-compiler in CI).
          echo "==> Step 7: cpu_dualcore_tb [SMP cache coherency]"
          cd sim
          rm -f work-obj93.cf cpu_ctb cpu_tb.vhh
          make TOOLS_DIR="$TOOLS_DIR" cpu_ctb cpu_dualcore_tb work-obj93.cf >/dev/null
          cd ..
          sim/tests/dualcore/run_repro.sh

          echo "==> pr-quick: Steps 1-7 PASSED"

      - name: J4 overlay decoder elaboration (Step 4b)
        working-directory: jcore-cpu
        env:
          TOOLS_DIR: ${{ github.workspace }}/jcore-soc/tools
        run: |
          set -euo pipefail
          # Build the J4 (sh4 overlay, PRIV_ARCH=1) DUT via CPU_VARIANT=j4.
          # sim/Makefile regenerates decode/*.vhd OUT-OF-TREE (DECODE_GEN_DIR,
          # via Makefile.inc's grouped-target rule) before analyzing it, so
          # nothing under the committed decode/ tree is touched. Building
          # work-obj93.cf runs `ghdl -a` over all three decoder architectures
          # (decode_table_{simple,direct,rom}.vhd) against the overlay-
          # generated tables. This is the elaboration gate the base steps
          # don't exercise: a constant-immediate (or any other) overlay
          # codegen break that generates cleanly but won't elaborate fails
          # HERE rather than silently on a developer's local J4 build.
          echo "==> analyze J4 DUT [CPU_VARIANT=j4] — all three decoders"
          cd sim
          rm -f work-obj93.cf cpu_tb.vhh cpu_ctb
          make TOOLS_DIR="$TOOLS_DIR" CPU_VARIANT=j4 work-obj93.cf >/dev/null
          cd ..
          echo "==> Step 4b: J4 overlay elaboration PASSED"

      - name: insns.json is in sync with the spec
        working-directory: jcore-cpu
        run: |
          if ! make -C decode insns-check; then
            echo "::error::docs/insns.json is out of date with the instruction spec." >&2
            echo "Fix: run 'make -C decode insns' and commit docs/insns.json." >&2
            exit 1
          fi

  cache-sim:
    name: dcache scoreboard (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [sc, dc]
    steps:
      - name: Checkout jcore-cpu
        uses: actions/checkout@v4
        with:
          path: jcore-cpu

      - name: Checkout jcore-soc (cache deps)
        uses: actions/checkout@v4
        with:
          repository: mountain-reverie/jcore-soc
          path: jcore-soc

      - name: Install apt dependencies (GHDL, perl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghdl ghdl-mcode perl

      - name: Run dcache scoreboard (${{ matrix.mode }})
        working-directory: jcore-cpu
        run: JCORE_SOC="${{ github.workspace }}/jcore-soc" sim/cache_sim.sh ${{ matrix.mode }}
