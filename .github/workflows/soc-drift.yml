name: soc-drift
# Opens a submodule-bump PR in jcore-soc for every jcore-cpu change, so the
# SoC-level impact of a CPU commit (notably ULX3S Fmax, benchmarked by
# jcore-soc's board-synth.yml on every pull_request) is visible when the change
# is proposed rather than months later in aggregate. See
# docs/superpowers/specs/2026-07-26-soc-drift-bot-design.md.
#
# Open jcore-cpu PR -> draft jcore-soc PR on cpu-bump/pr-<N>, closed when the
# PR closes. Push to master -> non-draft PR on cpu-bump/master, left open for
# human review (benchmarks are not currently PR-blocking, so auto-merge would
# let regressions self-land).
#
# Fork PRs are deliberately skipped: `pull_request` withholds secrets from
# forks, and the usual remedy (pull_request_target) would hand a write-capable
# PAT to a job running against untrusted contributor content. Do not switch.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "jcore-cpu commit to bump jcore-soc to (default: master HEAD)"
        required: false
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write   # for the sticky link-back comment on this repo

jobs:
  sync:
    # Skip fork PRs (no secrets available -- see header). Closed PRs are
    # handled by the `retire` job below.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Collapse rapid pushes to one bump: each bump triggers a multi-hour synth
    # run downstream in jcore-soc, so queueing them is expensive and pointless.
    # Scoped to this job only so a `retire` run can never cancel a `sync` run
    # that is mid force-push (that would strand a branch with no PR on it).
    concurrency:
      group: soc-drift-sync-${{ github.event.pull_request.number || 'master' }}
      cancel-in-progress: true
    steps:
      - name: Checkout jcore-cpu
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Must match (or exceed) the `go` directive in jcore-soc's
          # tools/socgen/go.mod, or `make soc_gen` either self-downloads a
          # toolchain (GOTOOLCHAIN=auto) or hard-fails (GOTOOLCHAIN=local).
          go-version: "1.26"

      - name: Resolve source commit and PR
        id: src
        # `inputs.sha` is the one free-form value in this workflow, so it is
        # passed through env: rather than spliced into the script text, where
        # it could inject shell or forge extra GITHUB_OUTPUT keys.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"
            echo "src=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
            echo "src=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync jcore-soc bump PR
        env:
          SOC_PAT: ${{ secrets.DEPENDABOT_RECREATE_PAT }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_RECREATE_PAT }}
        run: scripts/soc_bump.sh sync "${{ steps.src.outputs.sha }}" "${{ steps.src.outputs.src }}"

      # Two tokens are in play here: the PAT reads the PR URL out of jcore-soc,
      # then this repo's own GITHUB_TOKEN posts the comment on jcore-cpu.
      - name: Link back on the jcore-cpu PR
        if: github.event_name == 'pull_request'
        # Both tokens come in through env: rather than the run: body -- GitHub
        # materialises run: blocks to a file on the runner, which would put the
        # secret on disk (the askpass helper exists to avoid exactly that).
        env:
          SOC_TOKEN: ${{ secrets.DEPENDABOT_RECREATE_PAT }}
          CPU_TOKEN: ${{ github.token }}
        run: |
          url="$(GH_TOKEN="$SOC_TOKEN" \
                 bash -c 'SOC_BUMP_LIB_ONLY=1 . scripts/soc_bump.sh; \
                          soc_pr_url "${{ steps.src.outputs.src }}"')"
          if [ -z "$url" ]; then
            echo "no bump PR open (no-op sync) -- skipping link-back"
            exit 0
          fi
          GH_TOKEN="$CPU_TOKEN" \
            scripts/soc_bump.sh comment "${{ steps.src.outputs.src }}" "$url"

  retire:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Own group, never cancelled: this is a teardown, and it must not be able
    # to race/cancel (or be cancelled by) a `sync` run in-flight for the same PR.
    concurrency:
      group: soc-drift-retire-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout jcore-cpu
        uses: actions/checkout@v4
        with:
          # Run the base branch's copy of the script, not the PR-authored merge
          # ref: no reason to execute PR content with a write-capable cross-repo
          # PAT, and refs/pull/N/merge may not resolve after the merge anyway.
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Close the draft bump PR
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_RECREATE_PAT }}
        run: scripts/soc_bump.sh close "${{ github.event.pull_request.number }}"
