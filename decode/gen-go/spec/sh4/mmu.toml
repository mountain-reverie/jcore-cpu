# SH-4 MMU control registers (J4 overlay, PRIV_ARCH). All privileged.
# These are additive overlay entries: absent from the base J2 decoder, so
# they raise General Illegal on J2. See spec §5.
#
# ---- ENCODING POLICY (why the read side lives in `0000 nnnn xxxx 1011`) ----
# J4 is targeted to be a superset of J2, SH-2A, SH-4 and SH-4A, so a J4-only
# instruction may not occupy an encoding any of those four defines. The read
# side originally sat in the `0000 nnnn xxxx 0011` family, which does NOT meet
# that bar -- three of its six members shadowed real SH-4A instructions:
#
#   STC PTEL,Rn      0000 nnnn 0110 0011  ==  SH-4A movli.l @Rm,R0   (LL of LL/SC)
#   STC ASIDR,Rn     0000 nnnn 0111 0011  ==  SH-4A movco.l R0,@Rn   (SC of LL/SC)
#   CMP/EQ PTEH,Rn   0000 nnnn 1101 0011  ==  SH-4/4A prefi @Rn
#
# `0000 nnnn xxxx 0011` has only two slots left that are clean against the
# target set, so the whole read side moved to `0000 nnnn xxxx 1011`, which had
# seven -- enough for all six plus the new CMP/MISS, and it already hosted
# LDTLB.RN Rm (0x?FB). Verify with:
#
#   go run ./cmd/cpugen freespace --avoid j2,sh2a,sh4,sh4a,dsp \
#       --overlay sh4 --form "----nnnn----1011" --region 0
#
# That block is now FULL. The next reserve for J4-only `0000 nnnn`-shaped
# instructions is `0000 nnnn xxxx 1000` (8 virgin slots as of this writing).
#
# ---- DELIBERATE FORECLOSURE: SH-DSP ----
# The LDC write side (`0100 mmmm xxxx 1110`, xxxx = 0101 PTEH / 0110 PTEL /
# 0111 ASIDR) overlays SH-DSP's `ldc Rm,MOD/RS/RE`, and STC EXPEVT/INTEVT/TRA
# in exceptions.toml likewise overlay `stc MOD/RS/RE,Rn`. This is NOT an
# oversight and cannot be avoided: after excluding j2/sh2a/sh4/sh4a the LDC
# family has exactly three surviving slots, and they are precisely the DSP
# ones. J4 therefore forecloses SH-DSP permanently. Recorded here because the
# freespace tool will report the overlap whenever `dsp` is left out of --avoid.

[[instr]]
  name = "LDC Rm, PTEH"
  privileged = true
  format = "m"
  opcode = "0100 mmmm 0101 1110"
  operation = "Rm -> PTEH (MMU page-table-entry high)"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "Rm"
    zbus = "PTEH"
    zbus_sel = "Y"

[[instr]]
  name = "STC PTEH, Rn"
  privileged = true
  format = "n"
  opcode = "0000 nnnn 1000 1011"
  operation = "PTEH -> Rn"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "PTEH"
    zbus = "Rn"
    zbus_sel = "Y"

[[instr]]
  name = "LDC Rm, PTEL"
  privileged = true
  format = "m"
  opcode = "0100 mmmm 0110 1110"
  operation = "Rm -> PTEL (MMU page-table-entry low)"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "Rm"
    zbus = "PTEL"
    zbus_sel = "Y"

[[instr]]
  name = "STC PTEL, Rn"
  privileged = true
  format = "n"
  opcode = "0000 nnnn 1001 1011"
  operation = "PTEL -> Rn"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "PTEL"
    zbus = "Rn"
    zbus_sel = "Y"

[[instr]]
  name = "LDC Rm, ASIDR"
  privileged = true
  format = "m"
  opcode = "0100 mmmm 0111 1110"
  operation = "Rm -> ASIDR (address space identifier)"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "Rm"
    zbus = "ASIDR"
    zbus_sel = "Y"

[[instr]]
  name = "STC ASIDR, Rn"
  privileged = true
  format = "n"
  opcode = "0000 nnnn 1011 1011"
  operation = "ASIDR -> Rn"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "ASIDR"
    zbus = "Rn"
    zbus_sel = "Y"

# ---- TLB-miss hot-path tag compares (jcore-only, PRIV_ARCH). Fuse the CSR read
# and the tag compare that the software TSB probe does on every miss: replace
# `STC PTEH,Rt; CMP/EQ Rn,Rt` (2 insns + a scratch reg) with one instruction
# that compares Rn directly against the CSR and sets T. Microcode = CMP/EQ
# (logic XOR, logic_sr ZERO) but with ybus sourced from the MMU CSR (the exact
# ybus the matching STC uses -- SEL_MMU), so no new datapath: single-cycle, no
# register written. Encoding co-located with the STC MMU-creg family (tail
# 1011), in the contiguous compare sub-block 1100/1101/1110 that sits directly
# below LDTLB.RN Rm (1111) and directly above the reads (1000/1001/1011). ----
[[instr]]
  name = "CMP/EQ PTEH, Rn"
  privileged = true
  format = "n"
  opcode = "0000 nnnn 1100 1011"
  operation = "When Rn = PTEH, 1 -> T (TSB VPN-tag compare)"
  [[instr.slots]]
    mask_int = "YES"
    logic = "XOR"
    logic_sr = "ZERO"
    pc = "INC"
    sr = "LOGIC"
    xbus = "Rn"
    ybus = "PTEH"

[[instr]]
  name = "CMP/EQ ASIDR, Rn"
  privileged = true
  format = "n"
  opcode = "0000 nnnn 1101 1011"
  operation = "When Rn = ASIDR, 1 -> T (TSB ASID-tag compare)"
  [[instr.slots]]
    mask_int = "YES"
    logic = "XOR"
    logic_sr = "ZERO"
    pc = "INC"
    sr = "LOGIC"
    xbus = "Rn"
    ybus = "ASIDR"

# ---- STC TSBPTR, Rn: read-only TSB slot pointer (M5, hardware-spec §2.8) ----
# Hardware computes TSBPTR on every TLB miss; software reads it on the miss hot
# path in one cycle. Read-only: there is no LDC TSBPTR (such an encoding would
# be illegal). The SH-4 STC control family `xxxx 0010` is fully occupied in base
# J-core, so this lives with the other MMU reads in the `xxxx 1011` family
# (PTEH=1000 / PTEL=1001 / ASIDR=1011); see the ENCODING POLICY note at the top.
[[instr]]
  name = "STC TSBPTR, Rn"
  privileged = true
  format = "n"
  opcode = "0000 nnnn 0100 1011"
  operation = "TSBPTR -> Rn (read-only TSB slot pointer)"
  [[instr.slots]]
    mask_int = "YES"
    pc = "INC"
    ybus = "TSBPTR"
    zbus = "Rn"
    zbus_sel = "Y"

# ---- CMP/MISS EXPEVT: fused fault-class test for the TLB-miss hot path ----
# All six TLB causes share the one vector VBR+0x400, so a PROTECTION fault
# against a VPN/ASID that still has a valid TSB slot also TSB-hits on the fast
# path. Installing that (e.g. read-only) entry again and retrying livelocks,
# because do_page_fault() is never reached to fix the pte up. The handler must
# therefore separate miss from protection on EVERY TSB hit -- the hottest path
# in the kernel. In software that costs three instructions and a scratch reg:
#
#     stc  expevt, r2        ! r2 = EXPEVT
#     add  #-128, r2         ! (mov #0x80 would sign-extend to 0xFFFFFF80)
#     cmp/pl r2              ! T = EXPEVT > 0x80  ->  protection fault
#
# CMP/MISS EXPEVT collapses all three into one, freeing r2 as well. Its sense
# is INVERTED relative to the sequence above (T=1 means MISS, so the handler
# uses BF, not BT) because that is what costs no new datapath: xbus already
# reaches buses.imm_val and ybus already has SEL_EXPEVT, but xbus has no
# SEL_EXPEVT input -- so EXPEVT has to be the RIGHT operand, and CMP/HS-shaped
# microcode computes `xbus >= ybus`, i.e. `128 >= EXPEVT`.
#
# THRESHOLD. The boundary is 128 (0x080) INCLUSIVE, not 127:
#     miss:       IMISS 0x040, DMISS_R 0x060, DMISS_W 0x080   -> all <= 0x080
#     protection: IPROT 0x0A0, DPROT_R/W 0x0C0                -> all >  0x080
# DMISS_W sits exactly ON the boundary, so a `>= 0x07F` test would misclassify
# every store miss as a protection fault. MULTI_HIT (0x180) never reaches this
# vector -- it goes to VBR+0x100 -- so it does not constrain the threshold.
# EXPEVT's known DPROT_R/DPROT_W lossiness does not matter here: both are
# protection faults and take the same branch. Unsigned compare is used (not
# signed) because EXPEVT is a 12-bit field zero-extended onto ybus.
[[instr]]
  name = "CMP/MISS EXPEVT"
  privileged = true
  format = "0"
  opcode = "0000 0000 1110 1011"
  operation = "When EXPEVT <= 0x080 (a TLB miss, not a protection fault), 1 -> T"
  [[instr.slots]]
    mask_int = "YES"
    arith = "SUB"
    arith_sr = ">="
    pc = "INC"
    sr = "ARITH"
    xbus = "128"
    ybus = "EXPEVT"

[[instr]]
  name = "LDTLB"
  privileged = true
  opcode = "0000 0000 0011 1000"
  operation = "PTEH/PTEL/ASIDR -> TLB"
  [[instr.slots]]
    tlb_wr = "YES"
    mask_int = "YES"
    pc = "INC"

# ---- LDTLB.RN: fused Load-TLB-and-Return, NO delay slot (SH-2A-style) ----
# Equivalent to LDTLB immediately followed by a non-delayed return: latch
# {PTEH, PTEL, ASIDR} into a TLB entry AND restore SR<-SSR, PC<-SPC and redirect
# WITHOUT executing a delay slot. Slot 0 installs the entry and restores SR (so
# MD/privilege is correct at the target before it dispatches); slot 1 sets
# PC<-SPC; slots 2-3 issue the fetch at the target and dispatch it using the
# same non-delayed redirect tail as exception entry / Break / Reset CPU.
# Opcode 0x0078 (0x0068 freed for SH-2A nott; 0x0078 is clean across all SH arches).
[[instr]]
  name = "LDTLB.RN"
  privileged = true
  format = "0"
  opcode = "0000 0000 0111 1000"
  operation = "PTEH/PTEL/ASIDR -> TLB; SR<-SSR, PC<-SPC (no delay slot)"

  [[instr.slots]]
    tlb_wr = "YES"
    ybus = "SSR"
    zbus_sel = "Y"
    sr = "Z"
    pc = "HOLD"
  [[instr.slots]]
    ybus = "SPC"
    zbus = "PC"
    zbus_sel = "Y"
    pc = "HOLD"
  [[instr.slots]]
    if_addy = "ZBUS"
    if_issue = "YES"
    pc = "HOLD"
  [[instr.slots]]
    dispatch = "YES"
    if_issue = "YES"
    pc = "INC"

# ---- LDTLB.RN Rm: LDTLB.RN with PTEL sourced from a GPR (jcore-only) ----
# Same install+return as LDTLB.RN, but slot 0 first does PTEL := Rm (fused
# LDC Rm,PTEL) so the TLB-miss HOT PATH -- which already has the TTE data in a
# register from the TSB prefetch -- installs in one instruction instead of
# `ldc Rm,ptel; ldtlb.rn`. The parameterless LDTLB.RN (0x0078) is retained for
# the slow path / setup code, where PTEL naturally lands in the CSR (the C
# walker writes it there). Encoding 0x?FB is the top of the `xxxx 1011` MMU
# block (see the ENCODING POLICY note at the top of this file); it does not
# alias the parameterless LDTLB.RN, which lives at 0x0078 in a different family.
[[instr]]
  name = "LDTLB.RN Rm"
  privileged = true
  format = "m"
  opcode = "0000 mmmm 1111 1011"
  operation = "Rm -> PTEL; PTEH/PTEL/ASIDR -> TLB; SR<-SSR, PC<-SPC (no delay slot)"

  [[instr.slots]]
    mask_int = "YES"
    ybus = "Rm"
    zbus = "PTEL"
    zbus_sel = "Y"
    pc = "HOLD"
  [[instr.slots]]
    tlb_wr = "YES"
    ybus = "SSR"
    zbus_sel = "Y"
    sr = "Z"
    pc = "HOLD"
  [[instr.slots]]
    ybus = "SPC"
    zbus = "PC"
    zbus_sel = "Y"
    pc = "HOLD"
  [[instr.slots]]
    if_addy = "ZBUS"
    if_issue = "YES"
    pc = "HOLD"
  [[instr.slots]]
    dispatch = "YES"
    if_issue = "YES"
    pc = "INC"

# ---- Break / Reset CPU: bit-11 pin (J4 overlay only) ----
# The base spec uses don't-care bit 11 (---- -010 / ---- -011). That is correct
# for J1/J2/J4 without MMU, because no TLB exception opcodes exist to alias with.
# With PRIV_ARCH, nibbles 0xA (TLB DMISS_W) and 0xB (TLB IPROT) occupy bit 11 = 1
# in the system plane. A don't-care bit 11 in Break ("-010") aliases nibble 0xA,
# causing a D-store TLB miss to assert `debug` and stall the CPU. Similarly
# "-011" aliases nibble 0xB (IPROT). Pinning bit 11 = 0 here, in the overlay only,
# avoids perturbing the base decoder logic minimizer (which would regress J2 ASIC
# Fmax by ~14% if pinned in the base spec). Same aliasing class fixed for
# Interrupt/Error/Slot Illegal/General Illegal in spec/sh4/exceptions.toml.

[[instr]]
  name = "Break"
  format = ""
  opcode = "---- 0010 dddd dddd"
  operation = ""
  plane = "system"

  [[instr.slots]]
    pc = "HOLD"

  [[instr.slots]]
    alu_y = "2"
    arith = "SUB"
    debug = "YES"
    pc = "HOLD"
    xbus = "PC"
    zbus = "PC"
    zbus_sel = "ARITH"

  [[instr.slots]]
    if_addy = "ZBUS"
    if_issue = "YES"
    pc = "HOLD"

  [[instr.slots]]
    dispatch = "YES"
    if_issue = "YES"
    pc = "INC"

[[instr]]
  name = "Reset CPU"
  format = "d8"
  opcode = "---- 0011 dddd dddd"
  operation = ""
  plane = "system"

  [[instr.slots]]
    pc = "HOLD"

  [[instr.slots]]
    event = "ack"
    pc = "HOLD"

  [[instr.slots]]
    ma_addy = "ZBUS"
    ma_op = "READ"
    ma_size = "32"
    pc = "HOLD"
    ybus = "U*4"
    zbus = "TEMP0"
    zbus_sel = "Y"

  [[instr.slots]]
    alu_y = "4"
    arith = "ADD"
    ma_addy = "ZBUS"
    ma_op = "READ"
    ma_size = "32"
    pc = "HOLD"
    wbus = "R15"
    xbus = "TEMP0"
    zbus_sel = "ARITH"

  [[instr.slots]]
    pc = "HOLD"
    zbus = "PC"
    zbus_sel = "W"

  [[instr.slots]]
    if_addy = "ZBUS"
    if_issue = "YES"
    logic = "XOR"
    pc = "HOLD"
    xbus = "TEMP1"
    ybus = "TEMP1"
    zbus = "VBR"
    zbus_sel = "LOGIC"

  [[instr.slots]]
    dispatch = "YES"
    if_issue = "YES"
    pc = "INC"

  [[instr.slots]]
